unit.rtsmod-archer.name = Лучнострел
unit.rtsmod-archer.description = Дешёвый дальнобойный юнит, очень силён в дальнем бою.

unit.rtsmod-rundashir.name = Рундашир
unit.rtsmod-rundashir.description = Тяжёлый юнит ближнего боя. Эффективен против копейщика.

unit.rtsmod-spearman.name = Копейщик
unit.rtsmod-spearman.description = Лёгкий юнит ближнего боя. Эффективен для быстрых вылазок на противника.

unit.rtsmod-rundashir.name = Кавалерист
unit.rtsmod-rundashir.description = Средний юнит ближнего боя. Очень быстр. Эффективен в молниеносных атаках на флангах.

unit.rtsmod-cannon.name = Пушка
unit.rtsmod-rundashir.description = Медленный, но сильный в атаке юнит. Рассчитан на дальний бой. Имеет маленький запас здоровья, который компенсируется за счёт большого урона и радиуса атаки.

unit.rtsmod-bomber.name = Бомбардир
unit.rtsmod-bomber.description = Юнит камикадзе. Взрывается при атаке.